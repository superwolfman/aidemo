# aidemo 生产编排（阿里云 ECS 单机）
# 服务：api（Express）+ web（内部 Nginx）+ edge（Caddy 自动 HTTPS）
# 数据库/LLM 走云（MongoDB Atlas + DashScope），无需本地 mongo 容器
#
# 用法：
#   1. cp .env.production.example .env.production 并填写
#   2. export VITE_API_BASE=https://app.agentdelivery.asia
#      export PUBLIC_HOST=app.agentdelivery.asia
#      export ORIGIN_PUBLIC_IP=<ECS 公网 IP>
#   3. docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BRANCH: ${APP_BRANCH:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
        APP_DIRTY: ${APP_DIRTY:-false}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    image: aidemo-api:prod
    container_name: aidemo-api
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
    # 只暴露到本机，公网由 Caddy edge 反代，不直接对公网
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # build 阶段注入前端 API 地址，换 IP/域名后需 --build 重新构建
        VITE_API_BASE: ${VITE_API_BASE}
        APP_ENV: production
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BRANCH: ${APP_BRANCH:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
        APP_DIRTY: ${APP_DIRTY:-false}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    image: aidemo-web:prod
    container_name: aidemo-web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: caddy:2.10.2-alpine
    container_name: aidemo-edge
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      PUBLIC_ROOT_HOST: ${PUBLIC_ROOT_HOST:-agentdelivery.asia}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
