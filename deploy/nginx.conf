# aidemo 生产 nginx 配置
# 关键：/api 反代到后端 api:4000，且必须关闭 buffering 以支持 SSE 流式
server {
    listen 80;
    server_name _;
    # Docker 容器重建后 IP 会变化，运行时重新解析 api 服务名，避免旧上游导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态产物根目录
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 静态资源长缓存（vite 产物带 hash 文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback：刷新子路由不 404
    location / {
        # SPA 入口必须每次向服务器校验；带 hash 的 /assets 仍使用长期 immutable 缓存。
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 服务名 api）
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare Access 在边缘验证后注入，后端仍会校验 JWT 签名/aud/iss。
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        # ===== SSE 流式关键配置（不可省）=====
        proxy_buffering off;        # 关闭缓冲，否则 SSE 会积压不吐
        proxy_cache off;
        proxy_read_timeout 1h;      # Run 执行可能几十秒
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";   # 清除 hop-by-hop 头，允许 keep-alive
        add_header X-Accel-Buffering no;   # 兜底：某些场景 nginx 仍会缓冲
        # ====================================
    }

    # 健康检查（nginx 自身）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
